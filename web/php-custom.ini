; Konfigurasi PHP untuk Workshop Day 1 & Day 2
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Batas resource default
max_execution_time = 15
memory_limit = 128M
post_max_size = 1M
upload_max_filesize = 1M

; Nonaktifkan fungsi eksekusi shell untuk mencegah penyalahgunaan dari kode peserta
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; OPcache aktif untuk performa, namun selalu cek perubahan file (revalidate_freq=0)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1
