<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # Blokir akses langsung ke file internal (wajib lewat router/rewrite rule)
        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteRule ^(lib|pages)/ - [R=404,L]

        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteRule ^(router|api|run_day1|run_day2)\.php$ - [R=404,L]

        # Aset statis langsung dilayani Apache
        RewriteRule ^assets/ - [L]

        # Healthcheck endpoint
        RewriteRule ^health$ /router.php [QSA,L]

        # API editor peserta
        RewriteRule ^p/([a-zA-Z0-9]+)/api\.php$ /api.php?token=$1 [QSA,L]

        # Aplikasi Day 1 peserta
        RewriteRule ^p/([a-zA-Z0-9]+)/app$ /p/$1/app/ [R=301,L]
        RewriteRule ^p/([a-zA-Z0-9]+)/app/(.*)$ /run_day1.php?token=$1&file=$2 [QSA,L]

        # Aplikasi Day 2 Laravel peserta (langsung rewrite dengan/tanpa trailing slash agar bebas 301 HTTP di balik proxy HTTPS)
        RewriteRule ^p/([a-zA-Z0-9]+)/laravel/?(.*)$ /run_day2.php?token=$1 [QSA,L]

        # Semua route lain (portal, editor, db, admin, beranda)
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ /router.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
